<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
<title id="title">WhatsApp reply card master — Garh Jaisal Haveli</title><desc id="desc">Square enquiry-preparation card that avoids implying availability, response time or booking confirmation.</desc>
<rect width="1080" height="1080" fill="#F7EFE0"/><rect x="40" y="40" width="1000" height="1000" rx="6" fill="none" stroke="#D9A441" stroke-width="3"/><rect x="40" y="40" width="1000" height="18" fill="#5B1A2B"/>
<text x="88" y="130" fill="#5B1A2B" font-family="Georgia,serif" font-size="30" letter-spacing="2">GARH JAISAL HAVELI</text><text x="88" y="174" fill="#5B1A2B" font-family="Arial,sans-serif" font-size="15">A LIVING FORT, A FAMILY HOME</text>
<text x="88" y="276" fill="#14122B" font-family="Georgia,serif" font-size="54">Planning a stay?</text><text x="88" y="330" fill="#5B1A2B" font-family="Arial,sans-serif" font-size="21">Share a few details so the hotel can check current options.</text>
<rect x="88" y="386" width="904" height="282" rx="6" fill="#5B1A2B"/><text x="132" y="448" fill="#D9A441" font-family="Arial,sans-serif" font-size="17" font-weight="700">IN YOUR MESSAGE</text>
<circle cx="144" cy="500" r="5" fill="#D9A441"/><text x="168" y="508" fill="#F7EFE0" font-family="Arial,sans-serif" font-size="22">Arrival and departure dates</text><circle cx="144" cy="558" r="5" fill="#D9A441"/><text x="168" y="566" fill="#F7EFE0" font-family="Arial,sans-serif" font-size="22">Number of guests</text><circle cx="144" cy="616" r="5" fill="#D9A441"/><text x="168" y="624" fill="#F7EFE0" font-family="Arial,sans-serif" font-size="22">Room or experience interests</text>
<text x="88" y="744" fill="#5B1A2B" font-family="Arial,sans-serif" font-size="18" font-weight="700">ASK US TO CONFIRM CURRENT RATES AND AVAILABILITY.</text><rect x="88" y="790" width="354" height="60" rx="6" fill="#B94A0E"/><text x="265" y="828" text-anchor="middle" fill="#F7EFE0" font-family="Arial,sans-serif" font-size="16" font-weight="700">MESSAGE ON WHATSAPP</text>
<text x="88" y="932" fill="#5B1A2B" font-family="Arial,sans-serif" font-size="17">@garhjaisal · www.hotelgarhjaisal.com</text><text x="88" y="976" fill="#5B1A2B" font-family="Arial,sans-serif" font-size="14">[ADD VERIFIED WHATSAPP DESTINATION IN CHANNEL POST]</text></svg>