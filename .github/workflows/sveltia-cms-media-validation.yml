name: Sveltia CMS media validation

on:
  push:
    branches:
      - cms-media
    paths:
      - 'content/gallery/**'
      - 'content/page-media/**'
      - 'img/gallery/**'
      - 'admin/config.yml'
      - 'include/gallery-data.php'
      - 'include/site-media-slots.php'
      - 'include/page-media-approval.php'
      - 'include/admin-auth.php'
      - 'include/media-library-audit.php'
      - 'admin/media-library.php'
      - 'tests/php/media-library-audit.php'
      - 'tests/php/site-media-slots-contract.php'
      - 'tests/php/admin-auth-contract.php'
      - 'scripts/sign-page-media-approval.php'
      - 'scripts/gallery_media.py'
      - 'tests/php/gallery-curation.php'
      - 'tests/php/sveltia-cms-config-contract.php'

permissions:
  contents: read

concurrency:
  group: sveltia-media-validation
  cancel-in-progress: true

jobs:
  validate:
    name: validate CMS gallery content (PHP 8.2)
    runs-on: ubuntu-latest
    steps:
      - name: Check out CMS branch
        uses: actions/checkout@v4
        with:
          ref: cms-media

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint gallery runtime
        run: php -l include/gallery-data.php

      - name: Validate managed gallery entries and image references
        run: php tests/php/gallery-curation.php

      - name: Validate Sveltia config and publication contract
        run: php tests/php/sveltia-cms-config-contract.php

      - name: Validate read-only media usage inventory
        run: php tests/php/media-library-audit.php

      - name: Validate page image slots and safe fallbacks
        run: php tests/php/site-media-slots-contract.php

      - name: Validate owner dashboard authentication contract
        run: php tests/php/admin-auth-contract.php
