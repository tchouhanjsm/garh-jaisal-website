name: Phase F12.3 image optimization bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/optimize-image-candidates.py"
      - "scripts/image-optimization-manifest.json"
      - "include/header-v2.php"
      - ".github/workflows/image-optimization-bootstrap.yml"

permissions:
  contents: write

jobs:
  generate-derivatives:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'feature/phase-f12-3-image-payload-reduction') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned image encoder
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Generate measured WebP derivatives and visual-review artifact
        run: python scripts/optimize-image-candidates.py

      - name: Upload before/after byte and visual-review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-optimization-review-${{ github.run_number }}
          path: artifacts/image-optimization/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit generated derivatives to the feature branch
        if: success()
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/optimized/
          if git diff --cached --quiet; then
            echo "No generated image derivative changes to commit."
            exit 0
          fi
          git commit -m "build: add optimized image derivatives"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

