name: Temporary sitemap generation for responsive image sizing

on:
  push:
    branches:
      - feature/responsive-image-slot-sizing-20261018

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Regenerate sitemap from source history
        run: php scripts/generate-sitemap.php
      - name: Validate generated sitemap against source history
        run: php scripts/generate-sitemap.php --check
      - name: Upload generated sitemap
        uses: actions/upload-artifact@v4
        with:
          name: generated-sitemap
          path: sitemap.xml
          if-no-files-found: error
          retention-days: 1
