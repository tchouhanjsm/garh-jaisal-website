name: Sveltia CMS branch sync

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sveltia-cms-branch-sync
  cancel-in-progress: false

jobs:
  sync:
    name: merge main into cms-media
    runs-on: ubuntu-latest
    steps:
      - name: Check out CMS branch with full history
        uses: actions/checkout@v4
        with:
          ref: cms-media
          fetch-depth: 0

      - name: Merge the latest main baseline without force-pushing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main cms-media
          git switch cms-media
          git merge --no-edit origin/main
          git push origin HEAD:cms-media
