name: Browser E2E and screenshots

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    name: browser E2E (PHP 8.2 / Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for responsive image generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned image tooling
        run: python -m pip install Pillow==11.3.0

      - name: Generate responsive WebP candidates for browser tests
        run: python scripts/build-responsive-image-assets.py

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Configure ephemeral owner credentials for Media Library E2E
        shell: bash
        run: |
          set -euo pipefail
          export GJ_MEDIA_ADMIN_E2E_USER="ci-media-owner"
          export GJ_MEDIA_ADMIN_E2E_PASSWORD="$(php -r 'echo bin2hex(random_bytes(24));')"
          export GJ_MEDIA_ADMIN_E2E_PASSWORD_HASH="$(php -r 'echo password_hash(getenv("GJ_MEDIA_ADMIN_E2E_PASSWORD"), PASSWORD_DEFAULT);')"
          echo "::add-mask::$GJ_MEDIA_ADMIN_E2E_PASSWORD"
          php -r '
            $config = [
              "media_admin_auth" => [
                "username" => getenv("GJ_MEDIA_ADMIN_E2E_USER"),
                "password_hash" => getenv("GJ_MEDIA_ADMIN_E2E_PASSWORD_HASH"),
              ],
            ];
            $contents = "<?php\nreturn " . var_export($config, true) . ";\n";
            if (file_put_contents("include/site-config.local.php", $contents) === false) {
              fwrite(STDERR, "Unable to create ephemeral Media Library test config.\n");
              exit(1);
            }
          '
          {
            printf 'GJ_MEDIA_ADMIN_E2E_USER=%s\n' "$GJ_MEDIA_ADMIN_E2E_USER"
            printf 'GJ_MEDIA_ADMIN_E2E_PASSWORD=%s\n' "$GJ_MEDIA_ADMIN_E2E_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The npm registry has returned gzip advisory responses without headers, causing
      # npm CLI to call the retired Quick Audit endpoint. Keep install deterministic,
      # then audit the same lockfile directly against the supported Bulk Advisory API.
      # The auditor normalizes mislabeled gzip responses and fails closed on bad data.
      - name: Install locked Node dependencies
        run: npm ci --no-audit

      - name: Test npm Bulk Advisory auditor
        run: node scripts/npm-bulk-advisory-audit.cjs --self-test

      - name: Check dependency advisories
        run: node scripts/npm-bulk-advisory-audit.cjs --audit

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run responsive browser tests
        run: npm run test:e2e

      - name: Verify restaurant form validation and analytics without sending mail
        env:
          GJ_RESTAURANT_MAIL_ENABLED: '1'
        run: npx playwright test tests/e2e/restaurant-form-validation.spec.js --project=desktop-1280

      - name: Upload page screenshot sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-sheet
          path: artifacts/page-sheet/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload curated visual and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-evidence-${{ github.run_number }}
          path: |
            artifacts/screenshots/home-hero-review/*.jpg
            artifacts/screenshots/responsive-spotchecks/*.png
            artifacts/seo-inventory/**/*.json
            artifacts/performance-baseline/**/*.json
            artifacts/image-payload-audit/**/*.json
            artifacts/responsive-image-assets/responsive-image-delivery-report.json
            artifacts/responsive-image-assets/responsive-image-delivery-review.jpg
            artifacts/image-accessibility/**/*.json
            artifacts/page-layout-inventory/**/*.json
            artifacts/head-snapshot/**/*.json
          if-no-files-found: warn
          retention-days: 14

      # Successful runs already publish the standalone page sheet and curated
      # screenshots. Upload only actionable Playwright failure files when needed;
      # do not re-upload screenshot attachments or the duplicate HTML report.
      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-failure-diagnostics-${{ github.run_number }}
          path: |
            test-results/**/trace.zip
            test-results/**/test-failed-*.png
            test-results/**/video.webm
            test-results/**/error-context.md
          if-no-files-found: warn
          retention-days: 7
