name: Browser E2E and screenshots

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    name: browser E2E (PHP 8.2 / Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ''

      - name: Install pinned Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run responsive browser tests
        run: npm run test:e2e

      - name: Upload screenshots, traces, and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-evidence-${{ github.run_number }}
          path: |
            artifacts/screenshots/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
