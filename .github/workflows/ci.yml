name: Site checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Show PHP version
        run: php --version

      - name: Lint PHP files
        shell: bash
        run: |
          set -o pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Run site checks
        run: php scripts/check-site.php --strict-images
