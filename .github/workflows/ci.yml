name: Site checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: checks (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PHP 7.4 is a compatibility signal only; production PHP must be confirmed
        # with the cPanel host before release.
        php-version: ['7.4', '8.2']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Show PHP version
        run: php --version

      - name: Lint PHP files
        shell: bash
        run: |
          set -o pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Run site checks
        run: php scripts/check-site.php --strict-images

      - name: Verify sitemap matches publication status
        run: php scripts/generate-sitemap.php --check

      - name: Verify experience publication boundaries
        run: php scripts/check-experience-publication.php
