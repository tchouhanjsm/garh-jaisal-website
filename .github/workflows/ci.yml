name: Site checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: checks (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PHP 7.4 is a compatibility signal only; production PHP must be confirmed
        # with the cPanel host before release.
        php-version: ['7.4', '8.2']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Show PHP version
        run: php --version

      - name: Set up Node.js for local Content Studio checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check local Content Studio JavaScript syntax
        run: node --check scripts/content-studio.js

      - name: Check one-click Content Studio launcher syntax
        run: bash -n "tools/content-studio/Start Content Studio.command"

      - name: Install Pillow for Content Studio photo placement checks
        run: python3 -c "import PIL" 2>/dev/null || python3 -m pip install --break-system-packages pillow

      - name: Exercise Content Studio live/draft publishing workflow
        run: node tests/node/content-studio.integration.js

      - name: Check Content Studio pack modules syntax
        run: |
          for f in scripts/studio/*.js scripts/check-content-pack.js tools/content-studio/start.js; do node --check "$f"; done

      - name: Content Studio pack evals (golden packs and bad packs)
        run: node tests/node/content-pack.test.js

      - name: Content Studio route snapshot (existing pages unchanged when content changes)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          base="origin/${{ github.base_ref }}"
          if git diff --name-only "$base"...HEAD | grep -qE '^(content/(experiences|editorial|gallery|pages)/|img/(tours|journal|gallery)/)'; then
            node scripts/studio/route-snapshot.js --against "$base"
          else
            echo "No Content Studio content changed; snapshot not needed."
          fi

      - name: Lint PHP files
        shell: bash
        run: |
          set -o pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Run site checks
        run: php scripts/check-site.php --strict-images

      - name: Verify sitemap matches publication status
        run: php scripts/generate-sitemap.php --check

      - name: Verify experience publication boundaries
        run: php scripts/check-experience-publication.php

      - name: Verify Content Studio data overlays and publication states
        run: php tests/php/content-studio-registry.php

      - name: Verify experience gallery assets
        run: php tests/php/experience-gallery-assets.php
      
      - name: Verify curated Gallery inventory and progressive enhancement
        run: php tests/php/gallery-curation.php
      - name: Verify shared quick-facts component contract
        run: php tests/php/at-a-glance-contract.php

      - name: Verify safe preloads and non-blocking fonts
        run: php tests/php/preload-contract.php
      - name: Test image-dimension cache reuse
        run: php tests/php/image-dimension-cache-contract.php

      - name: Verify experience discovery shortlist contract
        run: php tests/php/experience-discovery.php

      - name: Verify conversion-led website content and mobile contracts
        run: php tests/php/conversion-copy-contract.php

      - name: Verify success-only lead conversion instrumentation
        run: php tests/php/lead-conversion-contract.php

      - name: Verify structured enquiry context and safe recovery
        run: php tests/php/enquiry-context-contract.php

      - name: Verify launch hardening configuration
        run: php scripts/check-launch-hardening.php

      - name: Check runtime config structure (deployment secrets optional in CI)
        run: php scripts/check-runtime-config.php

      - name: Test runtime config validation and secret-safe diagnostics
        run: php tests/php/runtime-config-validation.php

      - name: Verify shared contact-channel configuration
        run: php tests/php/contact-channel-contract.php

      - name: Verify custom itinerary builder remains enquiry-only
        run: php tests/php/custom-itinerary-contract.php

      - name: Verify experience detail section navigation
        run: php tests/php/experience-detail-navigation-contract.php

      - name: Test private lead storage and rate limiting
        run: php tests/php/lead-storage-validation.php

      - name: Verify staging and non-production noindex behavior
        run: php tests/php/staging-noindex.php

  brand-contrast:
    name: brand contrast and token contract (PHP 8.2)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Verify brand contrast, tokens and motif asset
        run: php scripts/check-brand-contrast.php

  marketing-template-contract:
    name: marketing template source contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Verify first-party marketing masters
        run: php scripts/check-marketing-templates.php

  responsive-image-review:
    name: responsive image review
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned image tooling
        run: python -m pip install Pillow==11.3.0

      - name: Validate responsive image manifest and decode source images
        run: python scripts/build-responsive-image-assets.py --check

      - name: Build responsive image review candidates
        run: python scripts/build-responsive-image-review.py

      - name: Upload responsive image review artifact
        uses: actions/upload-artifact@v4
        with:
          name: responsive-image-review
          path: artifacts/responsive-image-review/
          if-no-files-found: error
          retention-days: 7
