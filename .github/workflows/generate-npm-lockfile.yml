name: Generate npm lockfile (temporary release preparation)

on:
  push:
    branches:
      - feature/final-release-hardening-20261018
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile from the declared manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile matches package manifest
        run: npm ls --package-lock-only
      - name: Publish generated lockfile for source review
        uses: actions/upload-artifact@v4
        with:
          name: generated-npm-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
