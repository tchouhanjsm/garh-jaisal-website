# Owner-managed visual gallery CMS.
# This branch is writable for Sveltia's Simple Workflow and Asset Library commits.
# Main remains the reviewed release branch; never point the CMS backend at main.
backend:
  name: github
  repo: tchouhanjsm/garh-jaisal-website
  branch: cms-media
  # Keep the owner workflow on the documented fine-grained token sign-in path.
  # The token is entered in Sveltia at runtime and is never stored in this file.
  auth_methods: [token]

# New and replacement Gallery uploads are isolated from images reused elsewhere.
media_folder: /img/gallery
public_folder: img/gallery

# Shared options supported by Sveltia's internal Git media storage.
# Browser-side raster optimisation runs before uploads are committed.
media_libraries:
  default:
    config:
      max_file_size: 15728640
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 84
          width: 1600
          height: 1600

collections:
  - name: gallery
    label: Gallery photos
    label_singular: Gallery photo
    folder: /content/gallery
    format: json
    create: true
    delete: false
    identifier_field: id
    slug:
      template: '{{id}}'
      editable:
        - create
    fields:
      - name: id
        label: Photo ID
        widget: string
        required: true
        hint: Use lowercase letters, numbers and hyphens only. Keep the ID stable after creation.
        pattern:
          - '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          - Use lowercase letters, numbers and hyphens only.
      - name: category
        label: Gallery category
        widget: select
        required: true
        default: hotel
        options:
          - label: Hotel & fort
            value: hotel
          - label: Rooms
            value: rooms
          - label: Desert experiences
            value: desert
          - label: Restaurant & rooftop
            value: restaurant
      - name: status
        label: Publication status
        widget: select
        required: true
        default: draft
        hint: Keep Draft while source rights, visual match, descriptive alt text and technical validation are incomplete. Live is a publication state, not evidence of those checks.
        options:
          - label: Draft — not shown publicly
            value: draft
          - label: Live — shown after review and deployment
            value: live
          - label: Hidden — retained but not shown publicly
            value: hidden
      - name: order
        label: Display order
        widget: number
        value_type: int
        required: true
        default: 100
        min: 1
        hint: Lower numbers appear first within a category. Choose a unique number in that category.
      - name: review_status
        label: Editorial review status
        widget: select
        required: true
        default: draft
        hint: Approved for release is an editorial decision only. The public Gallery still requires a trusted HMAC signature for this exact record and image.
        options:
          - label: Draft — not reviewed
            value: draft
          - label: Ready for review
            value: ready_for_review
          - label: Approved for release — evidence recorded and reviewed
            value: approved_for_release
          - label: Rejected
            value: rejected
      - name: sourceEvidence
        label: Source and rights evidence
        widget: object
        required: true
        fields:
          - name: status
            label: Rights evidence status
            widget: select
            required: true
            default: unverified
            options:
              - label: Unverified — not eligible for publication
                value: unverified
              - label: Owner-confirmed
                value: owner-confirmed
              - label: Licensed
                value: licensed
          - name: creator
            label: Creator or rights holder
            widget: string
            required: false
          - name: sourceUrl
            label: Original HTTPS source URL
            widget: string
            required: false
            pattern:
              - '^https://'
              - Use the original HTTPS source page.
          - name: licenseName
            label: Licence name and scope
            widget: string
            required: false
          - name: evidenceReference
            label: Rights evidence reference
            widget: string
            required: false
          - name: verifiedBy
            label: Rights verified by
            widget: string
            required: false
          - name: verifiedAt
            label: Rights verification date (YYYY-MM-DD)
            widget: string
            required: false
            pattern:
              - '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
              - Use a valid date in YYYY-MM-DD format.
      - name: visualReview
        label: Human visual review
        widget: object
        required: true
        fields:
          - name: status
            label: Visual subject match
            widget: select
            required: true
            default: not_assessed
            options:
              - label: Not assessed
                value: not_assessed
              - label: Matched to the described subject
                value: matched
              - label: Mismatch — do not use
                value: mismatch
          - name: evidence
            label: What was inspected and matched
            widget: text
            required: false
          - name: reviewer
            label: Visual reviewer
            widget: string
            required: false
          - name: reviewedAt
            label: Visual review date (YYYY-MM-DD)
            widget: string
            required: false
            pattern:
              - '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
              - Use a valid date in YYYY-MM-DD format.
      - name: altTextReview
        label: Alt-text review
        widget: object
        required: true
        fields:
          - name: status
            label: Alt-text accuracy
            widget: select
            required: true
            default: not_assessed
            options:
              - label: Not assessed
                value: not_assessed
              - label: Matched to the visible image
                value: matched
              - label: Mismatch — do not publish
                value: mismatch
          - name: evidence
            label: What was checked in the alt text
            widget: text
            required: false
          - name: reviewer
            label: Alt-text reviewer
            widget: string
            required: false
          - name: reviewedAt
            label: Alt-text review date (YYYY-MM-DD)
            widget: string
            required: false
            pattern:
              - '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
              - Use a valid date in YYYY-MM-DD format.
      - name: technicalValidation
        label: Technical image validation
        widget: object
        required: true
        fields:
          - name: status
            label: Technical validation status
            widget: select
            required: true
            default: pending
            options:
              - label: Pending
                value: pending
              - label: Verified — decoded and dimensions checked
                value: verified
              - label: Failed — do not use
                value: failed
          - name: evidenceReference
            label: Technical validation evidence reference
            widget: string
            required: false
      - name: image
        label: Photo
        widget: object
        fields:
          - name: src
            label: Image file
            widget: image
            required: true
            hint: Existing photos retain their current site path. New uploads and replacements are stored under img/gallery/.
          - name: alt
            label: Accessible description (alt text)
            widget: string
            required: true
            hint: Describe what is visible. Do not use keyword lists.
          - name: caption
            label: Caption (optional)
            widget: string
            required: false
            default: ''
          - name: crop
            label: Display shape
            widget: select
            required: true
            default: standard
            options:
              - label: Standard
                value: standard
              - label: Architectural arch
                value: arch
              - label: Landscape
                value: landscape
              - label: Portrait
                value: portrait


      - name: approval
        label: Signed publication approval
        widget: object
        required: true
        fields:
          - name: status
            label: Signed approval status
            widget: select
            required: true
            default: pending
            hint: Approved requires a trusted CLI signature. This CMS field alone never publishes a record.
            options:
              - label: Pending trusted signature
                value: pending
              - label: Approved — signed after review
                value: approved
              - label: Rejected
                value: rejected
              - label: Revoked
                value: revoked
          - name: asset_sha256
            widget: hidden
            default: ''
          - name: approved_by
            widget: hidden
            default: ''
          - name: approved_at
            widget: hidden
            default: ''
          - name: signature
            widget: hidden
            default: ''
