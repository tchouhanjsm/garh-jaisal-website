# Owner-managed visual gallery CMS.
# This branch is writable for Sveltia's Simple Workflow and Asset Library commits.
# Main remains the reviewed release branch; never point the CMS backend at main.
backend:
  name: github
  repo: tchouhanjsm/garh-jaisal-website
  branch: cms-media
  # Keep the owner workflow on the documented fine-grained token sign-in path.
  # The token is entered in Sveltia at runtime and is never stored in this file.
  auth_methods: [token]

# New and replacement Gallery uploads are isolated from images reused elsewhere.
media_folder: /img/gallery
public_folder: img/gallery

# Shared options supported by Sveltia's internal Git media storage.
# Browser-side raster optimisation runs before uploads are committed.
media_libraries:
  default:
    config:
      max_file_size: 15728640
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 84
          width: 1600
          height: 1600

collections:
  - name: gallery
    label: Gallery photos
    label_singular: Gallery photo
    folder: /content/gallery
    format: json
    create: true
    delete: false
    identifier_field: id
    slug:
      template: '{{id}}'
      editable:
        - create
    fields:
      - name: id
        label: Photo ID
        widget: string
        required: true
        hint: Use lowercase letters, numbers and hyphens only. Keep the ID stable after creation.
        pattern:
          - '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          - Use lowercase letters, numbers and hyphens only.
      - name: category
        label: Gallery category
        widget: select
        required: true
        default: hotel
        options:
          - label: Hotel & fort
            value: hotel
          - label: Rooms
            value: rooms
          - label: Desert experiences
            value: desert
          - label: Restaurant & rooftop
            value: restaurant
      - name: status
        label: Publication status
        widget: select
        required: true
        default: draft
        options:
          - label: Draft — not shown publicly
            value: draft
          - label: Live — shown after review and deployment
            value: live
          - label: Hidden — retained but not shown publicly
            value: hidden
      - name: order
        label: Display order
        widget: number
        value_type: int
        required: true
        default: 100
        min: 1
        hint: Lower numbers appear first within a category. Choose a unique number in that category.
      - name: review_status
        widget: hidden
        default: draft
      - name: image
        label: Photo
        widget: object
        fields:
          - name: src
            label: Image file
            widget: image
            required: true
            hint: Existing photos retain their current site path. New uploads and replacements are stored under img/gallery/.
          - name: alt
            label: Accessible description (alt text)
            widget: string
            required: true
            hint: Describe what is visible. Do not use keyword lists.
          - name: caption
            label: Caption (optional)
            widget: string
            required: false
            default: ''
          - name: crop
            label: Display shape
            widget: select
            required: true
            default: standard
            options:
              - label: Standard
                value: standard
              - label: Architectural arch
                value: arch
              - label: Landscape
                value: landscape
              - label: Portrait
                value: portrait

